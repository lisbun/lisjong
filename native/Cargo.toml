[package]
name = "lisjong-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Opt-in native backend prototype for lisjong hand evaluation (Issue #213)"

[lib]
name = "_lisjong_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "=0.29.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
