[package]
name = "lisjong-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Opt-in native backend prototype for lisjong hand evaluation (Issue #213)"

[lib]
name = "_lisjong_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "=0.29.2", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
