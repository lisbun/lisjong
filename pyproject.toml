[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lisjong"
version = "0.1.0"
description = "Personal Japanese riichi mahjong AI for RiichiEnv and RiichiLab"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "lisbun" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.0"]
reference = ["mahjong==2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lisjong.hand_evaluation" = [
    "_shanten_table.bin",
    "_structural_predicate_table.bin",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
