name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v --durations 30

  ml-tests:
    name: ml-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Install locked CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Verify locked CPU PyTorch
        run: python -c "import torch; assert torch.__version__ == '2.13.0+cpu'; assert not torch.cuda.is_available()"

      - name: Run tests with the ML runtime present
        run: python -m unittest discover -s tests -v --durations 30

  reference-validation:
    name: reference validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and reference implementation
        run: python -m pip install --disable-pip-version-check -e ".[reference]"

      - name: Run reference validation
        run: python -m unittest discover -s reference_tests -v --durations 30

  native-backend:
    # Issue #213: opt-in Rust shanten backend prototype. The default install and
    # the jobs above stay Python-only; this job builds the native extension and
    # checks it against the Python backend and the independent oracle.
    name: native backend (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Show pinned Rust toolchain
        working-directory: native
        run: rustup show active-toolchain && rustc --version && cargo --version

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --check

      - name: Install package, development tools, and native backend
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check ./native

      - name: Run native backend equivalence tests
        env:
          LISJONG_REQUIRE_NATIVE: "1"
        run: python -m unittest tests.test_native_shanten_backend -v

      - name: Run full test suite with the Rust backend selected
        env:
          LISJONG_REQUIRE_NATIVE: "1"
          LISJONG_SHANTEN_BACKEND: rust
        run: python -m unittest discover -s tests -v --durations 30
